name: "Re-Usable: mvn verify"

on:
  workflow_call: # SRC: https://docs.github.com/en/actions/using-workflows/reusing-workflows

permissions:
  contents: read

env:
  ARCHITECTURE: x64

  # Java
  JDK_VERSION: 11
  JAVA_VERSION: 17
  JAVA_DISTRIBUTION: temurin

jobs:
  mvn_verify:
    name: mvn verify
    runs-on: ubuntu-latest
    steps:
      - uses: percebus/github-actions-common/.github/actions/checkout@main

      - name: JDK @ ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v6.2.0
        with:
          architecture: ${{ env.ARCHITECTURE }}
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}

      - name: ls
        run: ls -la
        working-directory: ./java

      - uses: go-task/setup-task@v2.2.0

      - name: task verify
        working-directory: ./java
        run: task verify

      - name: target.zip
        uses: actions/upload-artifact@v7.0.2
        with:
          name: SemanticKernelSampler.Java.WebApp.zip
          path: ./java/target
