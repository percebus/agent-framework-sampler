# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
---
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/" # Location of package manifests
    schedule:
      interval: "weekly"

  - package-ecosystem: "npm"
    directory: "/node/mcp-server.examples.quick-start/" # Location of package manifests
    schedule:
      interval: "weekly"

  - package-ecosystem: "npm"
    directory: "/node/mcp-server.rest-app.posts/" # Location of package manifests
    schedule:
      interval: "weekly"

  - package-ecosystem: "npm"
    directory: "/node/rest-app/" # Location of package manifests
    schedule:
      interval: "weekly"

  - package-ecosystem: "uv"
    directory: "/python/agent-framework-sampler-py/"
    schedule:
      interval: "weekly"

  - package-ecosystem: "uv"
    directory: "/python/semantic-kernel-sampler-py/"
    schedule:
      interval: "weekly"

  - package-ecosystem: "dotnet-sdk"
    directory: "/dotnet/AgentFrameworkSampler.DotNet/"
    schedule:
      interval: "weekly"

  - package-ecosystem: "dotnet-sdk"
    directory: "/dotnet/SemanticKernelSampler.DotNet/"
    schedule:
      interval: "weekly"

  - package-ecosystem: "maven"
    directory: "/java/"
    schedule:
      interval: "weekly"

  - package-ecosystem: "github-actions"
    directory: "/.github/workflows/"
    schedule:
      interval: "weekly"
