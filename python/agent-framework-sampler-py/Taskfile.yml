version: "3"

tasks:
  install:
    cmds:
      - bash ./scripts/uv/tool/install.ba.sh
      - uv python install
      - uv run -- poe sync_all
      - uv pip freeze
  clean:
    cmds:
      - uv run -- poe clean
  lint:
    cmds:
      - uv run -- poe lint
  format:
    cmds:
      - uv run -- poe format
  test:
    cmds:
      - exit 0
  build:
    cmds:
      - uv run -- poe build
  ci:
    cmds:
      - uv run -- poe ci
  verify:
    cmds:
      - task: lint
      - task: test
