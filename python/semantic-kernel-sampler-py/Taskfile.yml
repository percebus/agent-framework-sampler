version: "3"

tasks:
  install:
    cmds:
      - ../../scripts/uv/tool/install.ba.sh
      - uv python install
      - uv run -- poe sync_all
      - uv pip freeze
  lint:
    cmds:
      - uv run -- poe lint
  test:
    cmds:
      - exit 0
  build:
    cmds:
      - uv run -- poe build
  ci:
    cmds:
      - uv run -- poe ci
