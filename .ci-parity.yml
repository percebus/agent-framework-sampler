runner: taskfile
taskfile: ""
workflows:
  - .github/workflows/*.yml
  - .github/workflows/*.yaml

  # TODO? or XXX?
  # - .github/actions/**/action.yml
  # - .github/actions/**/action.yaml

invokers:
  shell:
    [
      task,
      go-task,
      "go tool task",
      "go tool github.com/go-task/task/v3/cmd/task",
      "go run github.com/go-task/task/v3/cmd/task",
    ]

  #
  # Where is this action?
  # actions:
  #   - uses: ./.github/actions/run-task
  #     input: task

tools:
  extend: []
  remove: []
  replace: []
transparent: [sudo, env, time, nice, ionice, timeout, nohup, xvfb-run, chronic]
allow: []
baseline: .ci-parity-baseline.json
