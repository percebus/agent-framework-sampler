version: "3"

tasks:
  install:
    cmds:
      - dotnet restore
  lint:
    deps:
      - install
    cmds:
      # TODO stylecop cli
      - exit 0
  format:
    cmds:
      # TODO stylecop cli
      - exit 0
  build:
    deps:
      - install
    cmds:
      - dotnet build
  test:
    deps:
      - build
    cmds:
      - dotnet test
  verify:
    cmds:
      - task: lint
      - task: test
  ci:
    cmds:
      - task: lint
      - task: test
