version: "3"

tasks:
  install:
    cmds:
      - dotnet restore
  lint:
    cmds:
      # TODO stylecop cli
      - exit 0
  test:
    cmds:
      - dotnet test
  build:
    cmds:
      - dotnet build
  verify:
    deps:
      - lint
      # does dotnet restore & build automatically
      - test
  ci:
    deps:
      - install
      - lint
      - build
      - test
